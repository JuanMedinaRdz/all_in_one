<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>To Do's celebración — móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e1116}
@keyframes steam{0%{transform:translateY(4px);opacity:0}40%{opacity:.75}100%{transform:translateY(-7px);opacity:0}}
.steam{animation:steam 1.8s ease-in-out infinite}.s2{animation-delay:.6s}.s3{animation-delay:1.2s}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-10px)}60%{transform:translateY(0)}75%{transform:translateY(-4px)}}
.hop{animation:hop 1.4s ease-in-out infinite}
@keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:0}15%{opacity:1}100%{transform:translateY(120px) rotate(260deg);opacity:0}}
.conf{animation:fall 2.6s ease-in infinite}.f2{animation-delay:.4s}.f3{animation-delay:.9s}.f4{animation-delay:1.3s}.f5{animation-delay:1.8s}.f6{animation-delay:2.2s}
@keyframes twinkle{0%,100%{transform:scale(.55);opacity:.25}50%{transform:scale(1);opacity:1}}
.twinkle{animation:twinkle 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:.6s}.t3{animation-delay:1.2s}
@keyframes check{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
.check{stroke-dasharray:24;animation:check .5s .2s ease-out both}
@keyframes grow{from{width:50%}to{width:100%}}
.grow{animation:grow 1.2s .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.pop{animation:pop .6s ease-out both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #0e1116; font-family: 'Nunito', system-ui, sans-serif; color: #e8edf2; overflow: hidden">
<div style="padding: 50px 20px 0; display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; font-size: 26px; font-weight: 900">To Do's</h1>
<div role="tablist" aria-label="Estado" style="display: flex; gap: 8px">
<button type="button" role="tab" aria-selected="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #242b36; background: #161b23; color: #9aa4b2; font: inherit; font-size: 13px; font-weight: 700">Por hacer · 2</button>
<button type="button" role="tab" aria-selected="true" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #a78bfa77; background: #241d3a; color: #c9b8ff; font: inherit; font-size: 13px; font-weight: 800">En progreso · 1</button>
<button type="button" role="tab" aria-selected="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #242b36; background: #161b23; color: #9aa4b2; font: inherit; font-size: 13px; font-weight: 700">Hecho · 0</button>
</div>
<div style="background: #161b23; border: 1px solid #222933; border-radius: 16px; padding: 14px; height: 120px; opacity: 0.5"></div>
</div>

<div style="position: absolute; inset: 0; background: rgba(8,10,14,.6)"></div>

<section aria-label="Detalle de tarea" style="position: absolute; left: 0; right: 0; bottom: 0; height: 640px; background: #161b23; border-radius: 28px 28px 0 0; border-top: 1px solid #262e39; padding: 12px 20px 30px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
<span style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #2f3844"></span>

<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 30px; height: 140px; pointer-events: none">
<span class="conf" style="position: absolute; left: 12%; width: 7px; height: 11px; border-radius: 2px; background: #f5c542"></span>
<span class="conf f2" style="position: absolute; left: 26%; width: 6px; height: 6px; border-radius: 50%; background: #a78bfa"></span>
<span class="conf f3" style="position: absolute; left: 44%; width: 7px; height: 11px; border-radius: 2px; background: #2ecc8f"></span>
<span class="conf f4" style="position: absolute; left: 63%; width: 6px; height: 6px; border-radius: 50%; background: #ff8fa3"></span>
<span class="conf f5" style="position: absolute; left: 78%; width: 7px; height: 11px; border-radius: 2px; background: #f0a43a"></span>
<span class="conf f6" style="position: absolute; left: 90%; width: 6px; height: 6px; border-radius: 50%; background: #5b8def"></span>
</div>

<div style="display: flex; align-items: center; gap: 14px; position: relative">
<div class="hop" style="width: 74px; height: 74px; flex-shrink: 0">
<svg width="74" height="74" viewBox="0 0 64 64" aria-hidden="true">
<path class="steam" d="M24 16c-3-4 3-6 0-11" fill="none" stroke="#c3cad3" stroke-width="2.4" stroke-linecap="round"></path>
<path class="steam s2" d="M31 16c-3-4 3-6 0-11" fill="none" stroke="#c3cad3" stroke-width="2.4" stroke-linecap="round"></path>
<path class="steam s3" d="M38 16c-3-4 3-6 0-11" fill="none" stroke="#c3cad3" stroke-width="2.4" stroke-linecap="round"></path>
<path d="M12 22h36v12a16 16 0 0 1-16 16h-4a16 16 0 0 1-16-16z" fill="#2ecc8f"></path>
<rect x="10" y="19" width="40" height="5" rx="2.5" fill="#5fe0ad"></rect>
<path d="M48 27h3a7 7 0 0 1 0 14h-4" fill="none" stroke="#2ecc8f" stroke-width="4.5"></path>
<path d="M21 34l3-3 3 3M33 34l3-3 3 3" fill="none" stroke="#0e1116" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M26 38h8a4 4 0 0 1-8 0z" fill="#0e1116"></path>
<ellipse cx="19" cy="38" rx="2.8" ry="1.7" fill="#ff8fa3" opacity="0.85"></ellipse>
<ellipse cx="41" cy="38" rx="2.8" ry="1.7" fill="#ff8fa3" opacity="0.85"></ellipse>
<path class="twinkle" d="M6 10l1 3 3 1-3 1-1 3-1-3-3-1 3-1z" fill="#f5c542"></path>
<path class="twinkle t2" d="M56 8l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1z" fill="#a78bfa"></path>
</svg>
</div>
<div class="pop">
<p style="margin: 0; font-size: 20px; font-weight: 900">¡Tarea completa!</p>
<p style="margin: 2px 0 0; font-size: 13px; color: #8b95a3">2 de 2 pasos · 30 min bien usados</p>
</div>
</div>

<div style="background: #1b212b; border: 1px solid #262e39; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 15px; font-weight: 800; line-height: 1.3">Mejorar app "All in one" parte del calendario.</div>
<div style="display: flex; gap: 8px; align-items: center"><span style="font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 7px; background: #3a2a12; color: #f3be74">Personal</span><span style="font-size: 12px; color: #8b95a3">8:34 → 9:04</span></div>
<div style="position: relative; height: 16px"><span style="position: absolute; left: 0; right: 0; top: 6px; height: 4px; border-radius: 2px; background: #2a323d"></span><span class="grow" style="position: absolute; left: 0; top: 6px; height: 4px; border-radius: 2px; background: #2ecc8f"></span><span style="position: absolute; right: -2px; top: 1px; width: 14px; height: 14px; border-radius: 50%; background: #2ecc8f"></span></div>
</div>

<div>
<h2 style="margin: 0 0 8px; font-size: 15px; font-weight: 800">Breakpoints</h2>
<div style="display: flex; align-items: center; gap: 12px; min-height: 48px">
<span style="width: 24px; height: 24px; border-radius: 50%; background: #2ecc8f; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0e1116" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg></span>
<span style="flex-grow: 1; font-size: 14px; color: #8b95a3; text-decoration: line-through">Mejorar con Claude Design</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8b95a3">8:49</span>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 48px; position: relative">
<span style="width: 24px; height: 24px; border-radius: 50%; background: #2ecc8f; display: flex; align-items: center; justify-content: center; position: relative"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0e1116" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="check" d="M5 12l4 4 10-10"></path></svg>
<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true" style="position: absolute; left: -8px; top: -8px"><circle class="twinkle" cx="4" cy="8" r="2" fill="#f5c542"></circle><circle class="twinkle t2" cx="36" cy="6" r="1.6" fill="#a78bfa"></circle><circle class="twinkle t3" cx="34" cy="35" r="1.8" fill="#ff8fa3"></circle></svg></span>
<span style="flex-grow: 1; font-size: 14px; font-weight: 700">Mejorar animaciones de despliegue</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8b95a3">9:04</span>
</div>
</div>

<div style="margin-top: auto; display: flex; gap: 10px">
<button type="button" style="flex-grow: 1; height: 50px; border-radius: 16px; border: 1px solid #262e39; background: #1b212b; color: #e8edf2; font: inherit; font-size: 14px; font-weight: 800">Deshacer</button>
<button type="button" style="flex-grow: 2; height: 50px; border-radius: 16px; border: none; background: #2ecc8f; color: #0e1116; font: inherit; font-size: 14px; font-weight: 900">Mover a Hecho</button>
</div>
</section>
</div>
</x-dc>

</html>
